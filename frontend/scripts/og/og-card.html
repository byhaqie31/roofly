<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1c1a17;color:#f7f4ed;font-family:Inter,system-ui,sans-serif}
  .bg{position:absolute;inset:0}
  .bg img{position:absolute;left:0;bottom:0;width:1200px;height:675px;object-fit:cover;object-position:bottom;opacity:.95}
  .bg .wash{position:absolute;inset:0;background:
    radial-gradient(ellipse 55% 45% at 85% 0%, rgba(196,77,38,.28), transparent 60%),
    linear-gradient(180deg,#1c1a17 0%,rgba(28,26,23,.75) 45%,rgba(28,26,23,.25) 75%,#1c1a17 100%)}
  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:600;letter-spacing:-.01em}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(231,106,63,.14);box-shadow:inset 0 0 0 1px rgba(231,106,63,.4);color:#e76a3f;font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .dot{width:10px;height:10px;border-radius:50%;background:#e76a3f}
  h1{margin:22px 0 0;font-size:86px;line-height:1.02;letter-spacing:-.03em;font-weight:600}
  h1 .accent{color:#e76a3f}
  p{margin:26px 0 0;font-size:26px;line-height:1.35;color:rgba(247,244,237,.82);max-width:760px}
  .url{font-size:20px;color:rgba(247,244,237,.6);letter-spacing:.02em}
</style></head><body>
<div class="bg"><img src="../../public/marketing/hero-skyline.svg"><div class="wash"></div></div>
<div class="wrap">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#c44d26" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Roofly.my
  </div>
  <div>
    <span class="pill"><span class="dot"></span>Coming soon</span>
    <h1>Property management,<br><span class="accent">reimagined.</span></h1>
    <p>The modern home for Malaysian landlords and their tenants. Properties, agreements, payments, maintenance — all in one place.</p>
  </div>
  <div class="url">roofly.my</div>
</div>
</body></html>
