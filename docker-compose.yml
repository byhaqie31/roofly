# ─────────────────────────────────────────────────────────────────────────────
# Roofly — production-shaped full stack.
#
# This is the BASE compose file. On the VPS, GHA invokes:
#   docker compose -f docker-compose.yml up -d --build
#
# Locally, `docker compose up` auto-loads docker-compose.override.yml on top,
# which switches to dev build targets and mounts source for HMR/hot-reload.
#
# Per-environment values come from each VPS clone's local `.env` (gitignored).
# Defaults are production-safe — a fresh clone with no .env serves prod
# behaviour and never accidentally leaks demo widgets to real customers.
# See .env.example for what to set per environment (demo / uat / production).
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Frontend (Nuxt 4) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - NUXT_PUBLIC_APP_ENV=${NUXT_PUBLIC_APP_ENV:-production}
      - NUXT_PUBLIC_USE_MOCK=${NUXT_PUBLIC_USE_MOCK:-false}
      - NUXT_PUBLIC_DEMO_FEEDBACK_URL=${NUXT_PUBLIC_DEMO_FEEDBACK_URL:-}
      - NUXT_PUBLIC_FEATURE_ADMIN=${NUXT_PUBLIC_FEATURE_ADMIN:-true} # admin back office; demo forces off regardless
      - NUXT_PUBLIC_FEATURE_DOCUMENTS=${NUXT_PUBLIC_FEATURE_DOCUMENTS:-true}
      - NUXT_PUBLIC_TRACKING=${NUXT_PUBLIC_TRACKING:-true} # marketing-site analytics beacon; demo is always a no-op
      # Where the BROWSER reaches the API. Must be the public origin + /api
      # (e.g. https://uat.roofly.my/api) — the host nginx proxies /api/ to the
      # backend nginx container below. Without this the default is
      # http://localhost:8000/api, i.e. the visitor's own machine.
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api}
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-https://roofly.my} # absolute og:image / canonical origin
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=${NUXT_PUBLIC_GOOGLE_CLIENT_ID:-} # empty hides Google sign-in
    depends_on:
      - backend
    networks:
      - roofly

  # ── Backend API (Laravel 13 + PHP-FPM) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DEMO_URL=${DEMO_URL:-https://demo.roofly.my}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-roofly}
      - DB_USERNAME=${DB_USERNAME:-roofly}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-roofly}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-secret}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:3000}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-null} # ".roofly.my" in prod so admin.roofly.my shares the cookie
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-} # same OAuth web client id as NUXT_PUBLIC_GOOGLE_CLIENT_ID
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@roofly.my}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Roofly.my}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - roofly

  # ── Nginx (reverse proxy for backend) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-nginx
    restart: unless-stopped
    ports:
      # Loopback only: the host nginx proxies <subdomain>/api/ here. Each VPS
      # clone must set a distinct BACKEND_PORT (see .env.example).
      - "127.0.0.1:${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend/public:/var/www/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - roofly

  # ── Queue Worker ───────────────────────────────────────────────────────────
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-queue-worker
    restart: unless-stopped
    command: php artisan queue:work rabbitmq --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      # Mail links (reset / invite) are rendered HERE, not in the API container.
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DEMO_URL=${DEMO_URL:-https://demo.roofly.my}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-roofly}
      - DB_USERNAME=${DB_USERNAME:-roofly}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-roofly}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-secret}
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@roofly.my}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Roofly.my}
    depends_on:
      - backend
      - rabbitmq
    networks:
      - roofly

  # ── Scheduler (Laravel cron: invoice generation, reminders, expiry alerts) ─
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DEMO_URL=${DEMO_URL:-https://demo.roofly.my}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-roofly}
      - DB_USERNAME=${DB_USERNAME:-roofly}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-roofly}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-secret}
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-2525}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@roofly.my}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Roofly.my}
    depends_on:
      - backend
      - rabbitmq
    networks:
      - roofly

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-roofly}
      MYSQL_USER: ${DB_USERNAME:-roofly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    # No host port on purpose — only the compose network needs MySQL. Several
    # environments share one VPS, and publishing 3306 from each of them is what
    # made the UAT deploy fail ("failed to set up container networking").
    # docker-compose.override.yml publishes it for local tooling.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "roofly", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roofly

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - roofly

  # ── RabbitMQ ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-roofly}-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-roofly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - roofly

networks:
  roofly:
    driver: bridge

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
