name: Deploy roofly to Hostinger VPS

# One workflow handles all three environments. The branch determines:
#   demo-roofly → ~/roofly-demo  → demo.roofly.my  (host port 3001)
#   UAT         → ~/roofly-uat   → uat.roofly.my   (host port 3004)
#   main        → ~/roofly       → roofly.my       (host port 3002)
# Note: 3003 is taken by axelnova-frontend on this VPS — UAT uses 3004 instead.
#
# Per-clone .env files on the VPS supply NUXT_PUBLIC_APP_ENV, NUXT_PUBLIC_API_BASE,
# APP_KEY, DB/MAIL credentials, etc. (see .env.example). The workflow doesn't
# bake env-specific values — it pulls, rebuilds, migrates, and health-checks.
#
# Required GitHub secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.

on:
  push:
    branches:
      - demo-roofly
      - UAT
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            BRANCH="${{ github.ref_name }}"

            # Branch → VPS clone path + host port for healthcheck.
            case "$BRANCH" in
              demo-roofly)
                DEPLOY_PATH="$HOME/roofly-demo"
                HEALTH_PORT=3001
                ;;
              UAT)
                DEPLOY_PATH="$HOME/roofly-uat"
                HEALTH_PORT=3004
                ;;
              main)
                DEPLOY_PATH="$HOME/roofly"
                HEALTH_PORT=3002
                ;;
              *)
                echo "Unknown branch: $BRANCH"
                exit 1
                ;;
            esac

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Clone path $DEPLOY_PATH does not exist on VPS."
              echo "Bootstrap this environment first — see README §Multi-environment deployment."
              exit 1
            fi

            echo "==> Deploying $BRANCH → $DEPLOY_PATH (host port $HEALTH_PORT)"
            cd "$DEPLOY_PATH"

            git pull origin "$BRANCH"

            # -f docker-compose.yml bypasses docker-compose.override.yml (which
            # is for local dev only — switches to dev target with bind mounts).
            docker compose -f docker-compose.yml up -d --build

            # Backend environments (UAT / prod) also need the schema brought up
            # to date and the admin permission rows present. Both steps are
            # idempotent. demo-roofly is frontend-only — its compose file has no
            # `backend` service — so the whole block is skipped there.
            if docker compose -f docker-compose.yml config --services | grep -qx backend; then
              echo "==> Running migrations"
              attempt=1
              until docker compose -f docker-compose.yml exec -T backend php artisan migrate --force; do
                if [ "$attempt" -ge 6 ]; then
                  echo "Migrations still failing after $attempt attempts — recent backend logs:"
                  docker compose -f docker-compose.yml logs --tail 30 backend db
                  exit 1
                fi
                attempt=$((attempt + 1))
                echo "Database not ready yet — retrying in 10s (attempt $attempt/6)..."
                sleep 10
              done
              docker compose -f docker-compose.yml exec -T backend php artisan db:seed --class=AdminPermissionSeeder --force
              # Workers hold compiled code in memory; make sure they run the new build.
              docker compose -f docker-compose.yml restart queue-worker scheduler
            fi

            echo "==> Waiting for app to respond on port $HEALTH_PORT..."
            sleep 5
            if curl -sf "http://localhost:$HEALTH_PORT" > /dev/null; then
              echo "✓ App is running"
            else
              echo "⚠ App may not be responding — recent logs:"
              docker compose -f docker-compose.yml logs --tail 30
              exit 1
            fi

            docker image prune -f
